<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0d24">
<title>Тест произношения имени</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: radial-gradient(ellipse at center, #1c1e4a 0%, #0c0d24 100%);
    background-color: #0c0d24;
    min-height: 100vh;
    box-sizing: border-box;
    font-family: -apple-system, system-ui, sans-serif;
    color: #fff;
  }
  h1 { font-size: 20px; text-align: center; margin: 0 0 6px; }
  p { text-align: center; color: rgba(255,255,255,0.6); font-size: 14px; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 480px; margin: 0 auto; }
  button {
    padding: 18px 8px;
    font: 700 20px -apple-system, system-ui, sans-serif;
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 14px;
    cursor: pointer;
  }
  button:active { background: rgba(255,255,255,0.3); }
  .num { display: block; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.5); margin-bottom: 4px; }
</style>
</head>
<body>
<h1>Как звучит «Артур»?</h1>
<p>Тапни по варианту — услышишь фразу из игры.<br>Запомни номер лучшего.</p>
<div class="grid" id="grid"></div>
<script>
(() => {
  // варианты написания, которые отдаются синтезатору
  const VARIANTS = [
    'Артур',
    'Арту́р',
    'Ар-тур',
    'Ар тур',
    'Арртур',
    'Артурр',
    'Артуур',
    'Артур!',
  ];
  // выбор голоса и настройки — точно как в игре
  let ruVoice = null, ruVoices = [];
  function pickVoice() {
    const all = speechSynthesis.getVoices();
    ruVoices = all.filter(v => (v.lang || '').toLowerCase().startsWith('ru'));
    const score = (v) => /google/i.test(v.name) ? 0 : /enhanced|premium|премиум|улучшен/i.test(v.name) ? 1 : 2;
    ruVoices.sort((a, b) => score(a) - score(b));
    const saved = localStorage.getItem('arthurVoice');
    const idx = ruVoices.findIndex(v => v.name === saved);
    ruVoice = ruVoices[idx >= 0 ? idx : 0] || null;
  }
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;

  let lastUtterance = null;
  function speak(text) {
    const doSpeak = () => {
      speechSynthesis.resume();
      const u = new SpeechSynthesisUtterance(text);
      lastUtterance = u;
      u.lang = 'ru-RU';
      if (ruVoice && ruVoices.length > 1) u.voice = ruVoice;
      u.rate = 0.85;
      u.pitch = 1.1;
      u.volume = 1;
      speechSynthesis.speak(u);
    };
    if (speechSynthesis.speaking || speechSynthesis.pending) {
      speechSynthesis.cancel();
      setTimeout(doSpeak, 80);
    } else {
      doSpeak();
    }
  }

  const grid = document.getElementById('grid');
  VARIANTS.forEach((v, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="num">№${i + 1}</span>${v}`;
    b.addEventListener('click', () => speak(`${v}, покажи — мишку!`));
    grid.appendChild(b);
  });
})();
</script>
</body>
</html>
