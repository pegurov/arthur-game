<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0d24">
<title>Угадайка Артура</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1c1e4a 0%, #0c0d24 100%);
    background-color: #0c0d24;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
  }
  #question {
    position: fixed;
    top: 3vh;
    left: 0;
    right: 0;
    text-align: center;
    font: 800 5.5vmin -apple-system, system-ui, sans-serif;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.95);
    z-index: 15;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22vmin;
  }
  .card {
    text-align: center;
    cursor: pointer;
    will-change: transform;
    transition: transform 0.5s, opacity 0.4s, filter 0.5s;
  }
  .card .emoji {
    display: block;
    font-size: 34vmin;
    line-height: 1.2;
  }
  .card .label {
    margin-top: 1vmin;
    font: 800 4.5vmin -apple-system, system-ui, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.85);
  }
  .card.pop {
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }
  .card.win {
    animation: winPulse 0.6s ease-in-out 2;
  }
  @keyframes winPulse {
    0%, 100% { transform: scale(1.15); }
    50% { transform: scale(1.35); }
  }
  .card.lose {
    transform: translateY(5vmin) rotate(-10deg) scale(0.85);
    filter: grayscale(0.8);
    opacity: 0.5;
  }
  .card.dim {
    opacity: 0.2;
  }
  .card.reveal {
    transform: scale(1.3);
  }
  /* телефон: картинки крупнее относительно экрана и дальше друг от друга */
  @media (max-width: 900px) and (orientation: landscape) {
    #stage { gap: 26vw; }
    .card .emoji { font-size: min(44vh, 34vw); }
    .card .label { font-size: min(6vh, 4vw); }
    #question { font-size: min(8vh, 5vw); top: 2vh; }
  }
  @media (max-width: 900px) and (orientation: portrait) {
    #stage { flex-direction: column; gap: 9vh; }
    .card .emoji { font-size: min(26vh, 56vw); }
    .card .label { font-size: min(3.4vh, 7vw); }
    #question { font-size: min(3.8vh, 8vw); top: 2vh; }
  }
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #dbg {
    position: fixed;
    left: 6px;
    right: 6px;
    bottom: 6px;
    font: 11px/1.4 monospace;
    color: #8f8;
    z-index: 30;
    pointer-events: none;
    word-break: break-all;
  }
  #hint {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font: 600 32px -apple-system, system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.55);
    text-align: center;
    pointer-events: none;
    transition: opacity 0.6s;
    z-index: 20;
  }
</style>
</head>
<body>
<div id="question"></div>
<div id="stage">
  <div class="card" id="card0"></div>
  <div class="card" id="card1"></div>
</div>
<canvas id="confetti"></canvas>
<div id="hint">Нажми любую клавишу<br>или коснись экрана 🎲</div>
<script>
(() => {
  const cards = [document.getElementById('card0'), document.getElementById('card1')];
  const questionEl = document.getElementById('question');
  const hint = document.getElementById('hint');
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  let W = 0, H = 0;
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ----- словарь: эмодзи + основное название (+ синонимы) -----
  // Форма слова выбирается один раз на раунд: как спросили, так и хвалим/показываем.
  const VOCAB = [
    // животные
    { e: '🐶', w: 'собачка', alt: ['пёсик'] },
    { e: '🐱', w: 'котик', alt: ['киса'] },
    { e: '🐰', w: 'зайчик', alt: ['кролик'] },
    { e: '🐻', w: 'мишка', alt: ['медведь'] },
    { e: '🐸', w: 'лягушка', alt: ['квакушка'] },
    { e: '🦆', w: 'уточка' },
    { e: '🐮', w: 'коровка' },
    { e: '🐷', w: 'свинка', alt: ['хрюшка', 'поросёнок'] },
    { e: '🐘', w: 'слоник' },
    { e: '🐴', w: 'лошадка' },
    { e: '🐵', w: 'обезьянка' },
    { e: '🐠', w: 'рыбка' },
    { e: '🦋', w: 'бабочка' },
    { e: '🐝', w: 'пчёлка' },
    { e: '🦊', w: 'лисичка', alt: ['лиса'] },
    { e: '🐭', w: 'мышка' },
    { e: '🐔', w: 'курочка' },
    { e: '🐓', w: 'петушок' },
    { e: '🐣', w: 'цыплёнок' },
    { e: '🦉', w: 'сова', alt: ['совушка'] },
    { e: '🐧', w: 'пингвин' },
    { e: '🐳', w: 'кит' },
    { e: '🐬', w: 'дельфин' },
    { e: '🐙', w: 'осьминог' },
    { e: '🐢', w: 'черепаха', alt: ['черепашка'] },
    { e: '🐍', w: 'змейка' },
    { e: '🦒', w: 'жираф' },
    { e: '🐑', w: 'овечка', alt: ['барашек'] },
    { e: '🐐', w: 'козлик' },
    { e: '🦔', w: 'ёжик' },
    { e: '🐌', w: 'улитка' },
    { e: '🐦', w: 'птичка' },
    { e: '🦁', w: 'лев', alt: ['львёнок'] },
    { e: '🐯', w: 'тигр', alt: ['тигрёнок'] },
    { e: '🐺', w: 'волк', alt: ['волчок'] },
    { e: '🦈', w: 'акула' },
    { e: '🐛', w: 'гусеница' },
    { e: '🕷️', w: 'паучок' },
    // транспорт
    { e: '🚗', w: 'машинка' },
    { e: '🚌', w: 'автобус' },
    { e: '🚂', w: 'паровозик' },
    { e: '✈️', w: 'самолётик' },
    { e: '⛵', w: 'кораблик' },
    { e: '🚀', w: 'ракета' },
    { e: '🚒', w: 'пожарная машина' },
    { e: '🚑', w: 'скорая помощь' },
    { e: '🚓', w: 'полицейская машина' },
    { e: '🚜', w: 'трактор' },
    { e: '🚲', w: 'велосипед' },
    { e: '🏍️', w: 'мотоцикл' },
    { e: '🚁', w: 'вертолёт', alt: ['вертолётик'] },
    { e: '🛴', w: 'самокат' },
    // еда
    { e: '🍎', w: 'яблоко', alt: ['яблочко'] },
    { e: '🍌', w: 'банан' },
    { e: '🍓', w: 'клубничка', alt: ['ягодка'] },
    { e: '🥕', w: 'морковка' },
    { e: '🍐', w: 'груша' },
    { e: '🍊', w: 'апельсин' },
    { e: '🍋', w: 'лимон' },
    { e: '🍉', w: 'арбуз' },
    { e: '🍇', w: 'виноград' },
    { e: '🍅', w: 'помидор', alt: ['помидорка'] },
    { e: '🥒', w: 'огурец', alt: ['огурчик'] },
    { e: '🌽', w: 'кукуруза' },
    { e: '🍞', w: 'хлеб', alt: ['хлебушек'] },
    { e: '🥛', w: 'молоко', alt: ['молочко'] },
    { e: '🧀', w: 'сыр' },
    { e: '🥚', w: 'яичко' },
    { e: '🍦', w: 'мороженое', say: 'моро́женое' },
    { e: '🍪', w: 'печенье', alt: ['печенька'] },
    { e: '🎂', w: 'тортик' },
    { e: '🍬', w: 'конфетка' },
    // природа
    { e: '⭐', w: 'звёздочка' },
    { e: '🌞', w: 'солнышко' },
    { e: '🌙', w: 'месяц' },
    { e: '🌸', w: 'цветочек' },
    { e: '🌳', w: 'дерево' },
    { e: '☁️', w: 'облачко', alt: ['тучка'] },
    { e: '🌧️', w: 'дождик' },
    { e: '❄️', w: 'снежинка' },
    { e: '⛄', w: 'снеговик' },
    { e: '🌈', w: 'радуга' },
    { e: '🍄', w: 'грибок' },
    { e: '🎄', w: 'ёлочка' },
    { e: '🔥', w: 'огонёк' },
    // вещи и дом
    { e: '⚽', w: 'мячик' },
    { e: '🎈', w: 'шарик' },
    { e: '🥁', w: 'барабан' },
    { e: '📖', w: 'книжка' },
    { e: '✏️', w: 'карандаш' },
    { e: '🎹', w: 'пианино' },
    { e: '🎸', w: 'гитара' },
    { e: '🔔', w: 'колокольчик' },
    { e: '🔑', w: 'ключик' },
    { e: '⏰', w: 'часики' },
    { e: '💡', w: 'лампочка' },
    { e: '☂️', w: 'зонтик' },
    { e: '🛏️', w: 'кроватка' },
    { e: '🪑', w: 'стульчик' },
    { e: '🚪', w: 'дверь' },
    { e: '🛁', w: 'ванна', alt: ['ванночка'] },
    { e: '🥄', w: 'ложка', alt: ['ложечка'] },
    { e: '📱', w: 'телефон' },
    { e: '👟', w: 'ботинки' },
    { e: '🧦', w: 'носочки' },
    { e: '🧢', w: 'кепка' },
    { e: '👕', w: 'футболка', alt: ['маечка'] },
    { e: '🎁', w: 'подарок' },
    { e: '❤️', w: 'сердечко' },
    { e: '👑', w: 'корона' },
    // части тела
    { e: '👃', w: 'носик' },
    { e: '👂', w: 'ушко' },
    { e: '🖐️', w: 'ладошка' },
    { e: '🦶', w: 'ножка' },
    { e: '👀', w: 'глазки' },
  ];
  // похвала собирается из блоков: возглас + иногда подтверждение слова + иногда бустер
  const OPENERS = [
    'Молодец!', 'Ура!', 'Правильно!', 'Умничка!', 'Точно!', 'Верно!',
    'Супер!', 'Здорово!', 'Отлично!', 'Браво!', 'Вот это да!', 'Какой молодец!',
    'Да!', 'Ух ты!', 'Класс!', 'Красота!', 'Есть!', 'Победа!',
  ];
  const BOOSTERS = [
    'Так держать!', 'Отлично получается!', 'Ты просто супер!', 'Продолжаем!',
    'Ты справился!', 'Дай пять!', 'Пять с плюсом!', 'Настоящий молодец!',
    'Здорово играешь!', 'У тебя отлично выходит!',
  ];

  // винительный падеж для «Ты нашёл …!»: правило по окончанию,
  // одушевлённые мужского рода и беглые гласные — явными исключениями
  const ACC_EXCEPTIONS = {
    'пёсик': 'пёсика', 'котик': 'котика', 'зайчик': 'зайчика', 'кролик': 'кролика',
    'медведь': 'медведя', 'слоник': 'слоника', 'лев': 'льва', 'львёнок': 'львёнка',
    'тигр': 'тигра', 'тигрёнок': 'тигрёнка', 'волк': 'волка', 'волчок': 'волчка',
    'кит': 'кита', 'дельфин': 'дельфина', 'осьминог': 'осьминога', 'жираф': 'жирафа',
    'пингвин': 'пингвина', 'ёжик': 'ёжика', 'козлик': 'козлика', 'петушок': 'петушка',
    'цыплёнок': 'цыплёнка', 'барашек': 'барашка', 'поросёнок': 'поросёнка',
    'паучок': 'паучка', 'снеговик': 'снеговика',
  };
  function accusative(word) {
    return word.split(' ').map((t) => {
      if (ACC_EXCEPTIONS[t]) return ACC_EXCEPTIONS[t];
      if (t.endsWith('ая')) return t.slice(0, -2) + 'ую';
      if (t.endsWith('а')) return t.slice(0, -1) + 'у';
      if (t.endsWith('я')) return t.slice(0, -1) + 'ю';
      return t;
    }).join(' ');
  }
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // ----- статистика угадываний: неугаданное загадываем чаще -----
  let stats = {};
  try { stats = JSON.parse(localStorage.getItem('arthurStats') || '{}'); } catch (err) { stats = {}; }
  const statFor = (w) => stats[w] || (stats[w] = { win: 0, lose: 0 });
  const saveStats = () => localStorage.setItem('arthurStats', JSON.stringify(stats));
  // вес слова: чем больше промахов и меньше побед, тем чаще оно выпадает
  const weightFor = (w) => { const s = stats[w]; return s ? (s.lose + 1) / (s.win + 1) : 1; };
  function pickTarget() {
    const candidates = VOCAB.filter(v => v.w !== prevWord);
    const weights = candidates.map(v => weightFor(v.w));
    let r = Math.random() * weights.reduce((a, b) => a + b, 0);
    for (let i = 0; i < candidates.length; i++) {
      r -= weights[i];
      if (r <= 0) return candidates[i];
    }
    return candidates[candidates.length - 1];
  }

  let lastOpener = null;
  let lastBooster = null;
  function makePraise(word) {
    let o;
    do { o = pick(OPENERS); } while (o === lastOpener);
    lastOpener = o;
    let phrase = o;
    const r = Math.random();
    if (r < 0.25) phrase += ` Это — ${word}!`;
    else if (r < 0.5) phrase += ` Ты нашёл ${accusative(word)}!`;
    if (Math.random() < 0.45) {
      let b;
      do { b = pick(BOOSTERS); } while (b === lastBooster);
      lastBooster = b;
      phrase += ` ${b}`;
    }
    return phrase;
  }

  // ----- звук -----
  let audio = null;
  function ensureAudio() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  }
  function playTone(freq, { peak = 0.2, dur = 0.9, type = 'triangle', shimmer = true } = {}) {
    if (!audio) return;
    const t = audio.currentTime;
    const gain = audio.createGain();
    gain.connect(audio.destination);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(peak, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    const osc = audio.createOscillator();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    osc.start(t);
    osc.stop(t + dur + 0.1);
    if (shimmer) {
      const g2 = audio.createGain();
      g2.connect(audio.destination);
      g2.gain.setValueAtTime(0, t);
      g2.gain.linearRampToValueAtTime(peak * 0.25, t + 0.02);
      g2.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.55);
      const o2 = audio.createOscillator();
      o2.type = 'sine';
      o2.frequency.value = freq * 2;
      o2.connect(g2);
      o2.start(t);
      o2.stop(t + dur);
    }
  }
  function winChime() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
      setTimeout(() => playTone(f, { peak: 0.18 }), i * 110));
  }
  function loseSound() {
    playTone(329.63, { peak: 0.12, dur: 0.7, type: 'sine', shimmer: false });
    setTimeout(() => playTone(261.63, { peak: 0.12, dur: 1.0, type: 'sine', shimmer: false }), 220);
  }

  // ----- диагностика речи: открой страницу с ?debug=1 -----
  const DEBUG = location.search.indexOf('debug') !== -1;
  let dbgEl = null;
  function dlog(msg) {
    if (!DEBUG) return;
    if (!dbgEl) { dbgEl = document.createElement('div'); dbgEl.id = 'dbg'; document.body.appendChild(dbgEl); }
    dbgEl.textContent = (msg + ' | ' + dbgEl.textContent).slice(0, 400);
  }

  // iOS 17+: без явного типа аудиосессии речь может глушиться при активном WebAudio
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (err) {}

  // ----- речь -----
  let ruVoice = null;
  let ruVoices = [];
  let voiceIdx = 0;
  function pickVoice() {
    const all = speechSynthesis.getVoices();
    ruVoices = all.filter(v => (v.lang || '').toLowerCase().startsWith('ru'));
    dlog(`voices:${all.length} ru:${ruVoices.length}`);
    // Google-голос обычно живее Милены, премиум-голоса лучше базовых
    const score = (v) => /google/i.test(v.name) ? 0 : /enhanced|premium|премиум|улучшен/i.test(v.name) ? 1 : 2;
    ruVoices.sort((a, b) => score(a) - score(b));
    const saved = localStorage.getItem('arthurVoice');
    const idx = ruVoices.findIndex(v => v.name === saved);
    voiceIdx = idx >= 0 ? idx : 0;
    ruVoice = ruVoices[voiceIdx] || null;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  // клавиша для родителя: переключить голос и услышать образец
  function nextVoice() {
    if (ruVoices.length < 2) { speak('Другого голоса нет'); return; }
    voiceIdx = (voiceIdx + 1) % ruVoices.length;
    ruVoice = ruVoices[voiceIdx];
    localStorage.setItem('arthurVoice', ruVoice.name);
    speak('Привет, Артур! Давай играть!');
  }
  let lastUtterance = null; // держим ссылку: iOS обрывает речь, если utterance собрал GC
  function speak(text, onend) {
    if (!('speechSynthesis' in window)) { if (onend) setTimeout(onend, 800); return; }
    const doSpeak = () => {
      try {
        speechSynthesis.resume(); // iOS порой держит движок на паузе
        const u = new SpeechSynthesisUtterance(text);
        lastUtterance = u;
        u.lang = 'ru-RU';
        // iOS не отдаёт улучшенные голоса в веб-список; если русский голос
        // в списке один, не навязываем его — по одному лишь lang движок берёт
        // системный голос по умолчанию (может оказаться улучшенной Миленой)
        if (ruVoice && ruVoices.length > 1) u.voice = ruVoice;
        u.rate = 0.85;
        u.pitch = 1.1;
        u.volume = 1;
        let done = false;
        const finish = () => { if (!done) { done = true; if (onend) onend(); } };
        u.onstart = () => dlog(`▶ ${text}`);
        u.onend = () => { dlog('✓ конец'); finish(); };
        u.onerror = (e) => { dlog(`✗ ${e.error || 'ошибка'}`); finish(); };
        if (onend) setTimeout(finish, 6000); // страховка, если браузер не пришлёт onend
        speechSynthesis.speak(u);
        dlog(`spk "${text}" голос:${ruVoice ? ruVoice.name : 'дефолт'}`);
      } catch (err) { dlog(`throw ${err.message}`); if (onend) onend(); }
    };
    // iOS: cancel() при пустой очереди глушит следующую фразу,
    // поэтому отменяем только занятую очередь, и говорим после паузы
    if (speechSynthesis.speaking || speechSynthesis.pending) {
      speechSynthesis.cancel();
      setTimeout(doSpeak, 80);
    } else {
      doSpeak();
    }
  }

  // ----- конфетти -----
  const particles = [];
  const brightColor = () => `hsl(${Math.floor(Math.random() * 360)}, 95%, 65%)`;
  function spawnBurst(x, y, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 150 + Math.random() * 400;
      particles.push({
        x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed - 120,
        r: 4 + Math.random() * 7,
        color: brightColor(),
        age: 0, life: 1.1 + Math.random() * 0.6,
      });
    }
  }
  let prev = performance.now();
  function frame(now) {
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    ctx.clearRect(0, 0, W, H);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.vy += 700 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const t = p.age / p.life;
      ctx.globalAlpha = t > 0.7 ? 1 - (t - 0.7) / 0.3 : 1;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ----- игра -----
  let started = false;
  let busy = false;
  let pair = null;
  let targetSide = 0;
  let prevWord = null;
  let roundWord = null; // форма слова этого раунда: как спросили, так и хвалим

  // как произносить слово: поле say позволяет подсказать синтезатору
  // ударение/произношение, не меняя само слово в словаре и статистике
  const spokenMain = (item) => item.say || item.w;

  function newRound() {
    busy = false;
    const target = pickTarget();
    let other;
    do { other = pick(VOCAB); } while (other === target);
    targetSide = Math.random() < 0.5 ? 0 : 1;
    pair = targetSide === 0 ? [target, other] : [other, target];
    prevWord = target.w;
    // форма слова на раунд: в четверти случаев синоним; для текста берём
    // написание без произносительных подсказок, для голоса — с ними
    const useAlt = !!(target.alt && Math.random() < 0.25);
    const displayWord = useAlt ? pick(target.alt) : target.w;
    roundWord = useAlt ? displayWord : spokenMain(target);
    questionEl.textContent = `Где ${displayWord}?`;

    cards.forEach((card, i) => {
      card.className = 'card';
      card.textContent = '';
      const emoji = document.createElement('div');
      emoji.className = 'emoji';
      emoji.textContent = pair[i].e;
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = pair[i].w;
      card.append(emoji, label);
      void card.offsetWidth; // перезапуск pop-анимации
      card.classList.add('pop');
    });
    speak(`Где — ${roundWord}?`);
  }

  function answer(side) {
    if (!started || busy || !pair) return;
    busy = true;
    if (side === targetSide) {
      statFor(pair[targetSide].w).win++;
      saveStats();
      winChime();
      cards[side].classList.add('win');
      cards[1 - side].classList.add('dim');
      const rect = cards[side].getBoundingClientRect();
      spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 40);
      setTimeout(() => speak(makePraise(roundWord), () => setTimeout(newRound, 500)), 500);
    } else {
      statFor(pair[targetSide].w).lose++;
      saveStats();
      loseSound();
      cards[side].classList.add('lose');
      setTimeout(() => speak(`Нет, это — ${spokenMain(pair[side])}`, () => {
        // показать правильную: она увеличивается, голос называет её
        cards[targetSide].classList.add('reveal');
        speak(`Вот это — ${roundWord}!`, () => setTimeout(newRound, 600));
      }), 400);
    }
  }

  // ----- ввод -----
  let lastFsTry = 0;
  function tryFullscreen() {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (isFs) return;
    const now = performance.now();
    if (now - lastFsTry < 1000) return;
    lastFsTry = now;
    try {
      const el = document.documentElement;
      const p = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
      if (p && p.catch) p.catch(() => {});
    } catch (err) { /* попробуем на следующем жесте */ }
  }

  function firstTouch() {
    ensureAudio();
    tryFullscreen();
    if (!started) {
      started = true;
      hint.style.opacity = '0';
      newRound();
      return true;
    }
    return false;
  }

  window.addEventListener('keydown', (e) => {
    e.preventDefault();
    if (firstTouch()) return;
    if (e.repeat) return;
    if (e.key === 'ArrowLeft') answer(0);
    else if (e.key === 'ArrowRight') answer(1);
    else if (e.key === ' ' && !busy && pair) speak(`Где — ${roundWord}?`);
    else if (e.key === 'v' || e.key === 'V' || e.key === 'г' || e.key === 'Г') nextVoice();
  }, { passive: false });

  // Разделение: разблокировка звука — по завершённому касанию (иначе iOS
  // глушит речь; click при touch-action:none вообще не приходит), а ответ
  // в игре — сразу по касанию, малыш может давить и держать сколько угодно.
  cards.forEach((card, i) => {
    card.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (started) answer(i);
    });
    card.addEventListener('pointerup', (e) => {
      e.stopPropagation();
      firstTouch();
    });
  });
  window.addEventListener('pointerup', () => { firstTouch(); });

  // защита от случайных жестов и закрытия
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  window.addEventListener('gesturestart', (e) => e.preventDefault());
  window.addEventListener('beforeunload', (e) => {
    if (started) { e.preventDefault(); e.returnValue = ''; }
  });

  // ----- автообновление -----
  // Standalone-версия на домашнем экране iOS кэшируется намертво, поэтому при
  // запуске тянем свежий HTML в обход кэша и, если он изменился, перезагружаемся.
  async function checkForUpdate() {
    try {
      const res = await fetch('index.html', { cache: 'no-store' });
      if (!res.ok) return;
      const html = await res.text();
      const prev = localStorage.getItem('appHtml');
      localStorage.setItem('appHtml', html);
      if (prev !== null && prev !== html && !started) {
        location.replace('./?u=' + new Date().getTime());
      }
    } catch (err) { /* офлайн — играем как есть */ }
  }
  checkForUpdate();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
  });
})();
</script>
</body>
</html>
