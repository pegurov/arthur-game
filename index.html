<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Игра Артура</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1c1e4a 0%, #0c0d24 100%);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
    cursor: crosshair;
  }
  canvas { display: block; }
  #hint {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font: 600 32px -apple-system, system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.55);
    text-align: center;
    pointer-events: none;
    transition: opacity 0.6s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Жми любые клавиши! 🎹✨<br>Или тыкай пальцем 👆</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  let W = 0, H = 0;
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ----- звук: мягкие колокольчики в пентатонике, всегда звучит приятно -----
  const SCALE = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99, 880.0];
  let audio = null;
  function ensureAudio() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  }
  function playNote(freq, peak = 0.22) {
    if (!audio) return;
    const t = audio.currentTime;
    const gain = audio.createGain();
    gain.connect(audio.destination);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(peak, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    const osc = audio.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    osc.connect(gain);
    osc.start(t);
    osc.stop(t + 1);
    const shimmer = audio.createGain();
    shimmer.connect(audio.destination);
    shimmer.gain.setValueAtTime(0, t);
    shimmer.gain.linearRampToValueAtTime(peak * 0.25, t + 0.015);
    shimmer.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    const osc2 = audio.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2;
    osc2.connect(shimmer);
    osc2.start(t);
    osc2.stop(t + 0.6);
  }
  const randomNote = () => SCALE[Math.floor(Math.random() * SCALE.length)];
  function playChord() {
    if (!audio) return;
    [0, 2, 4].forEach((i, n) =>
      setTimeout(() => playNote(SCALE[i + Math.floor(Math.random() * 3)], 0.18), n * 90));
  }

  // ----- частицы -----
  const EMOJIS = [
    '🐶','🐱','🦁','🐰','🐸','🐥','🦋','🐠','🐮','🐷','🦆','🐻','🐘','🦒','🐵','🐴','🐑','🐢','🐞','🐝',
    '🚗','🚌','🚜','🚂','✈️','🚁','🚀','⛵',
    '⭐','🌈','🎈','⚽','🌞','🌙','☁️','🌸','🌳',
    '🍎','🍌','🍓','🍊','🍉','🥕',
    '🎵','🥁','🧸','🎁','🦴','🏀'
  ];
  const particles = [];
  const brightColor = () => `hsl(${Math.floor(Math.random() * 360)}, 95%, 65%)`;

  // кэш спрайтов: каждую эмодзи рисуем шрифтом один раз, дальше только drawImage
  const SPRITE = 256;
  const spriteCache = new Map();
  function sprite(char) {
    let s = spriteCache.get(char);
    if (!s) {
      s = document.createElement('canvas');
      s.width = s.height = SPRITE;
      const c = s.getContext('2d');
      c.font = `${SPRITE * 0.78}px -apple-system, system-ui, sans-serif`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(char, SPRITE / 2, SPRITE / 2 + SPRITE * 0.04);
      spriteCache.set(char, s);
    }
    return s;
  }
  EMOJIS.forEach(sprite);

  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function addParticle(p) {
    particles.push(p);
    if (particles.length > 400) particles.splice(0, particles.length - 400);
  }

  function spawnGlyph(char, x, y, size) {
    addParticle({
      type: 'glyph', char, x, y, size,
      color: brightColor(),
      rot: (Math.random() - 0.5) * 0.5,
      vr: (Math.random() - 0.5) * 0.8,
      vy: -25 - Math.random() * 25,
      age: 0, life: 2.2,
    });
  }

  function spawnBurst(x, y, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 120 + Math.random() * 320;
      addParticle({
        type: 'confetti',
        x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed - 80,
        r: 4 + Math.random() * 7,
        color: brightColor(),
        age: 0, life: 1 + Math.random() * 0.5,
      });
    }
  }

  function spawnSpark(x, y) {
    addParticle({
      type: 'spark',
      x: x + (Math.random() - 0.5) * 14,
      y: y + (Math.random() - 0.5) * 14,
      r: 2 + Math.random() * 4,
      color: brightColor(),
      age: 0, life: 0.55,
    });
  }

  // ----- взаимодействие -----
  let interactions = 0;
  let lastFsTry = 0;

  // тротл появлений: не чаще одного раза в THROTTLE мс,
  // лишние нажатия просто игнорируются (никаких очередей и задержек)
  const THROTTLE = 160;
  let lastSpawn = -1e9;
  function throttled() {
    const now = performance.now();
    if (now - lastSpawn < THROTTLE) return true;
    lastSpawn = now;
    return false;
  }

  function tryFullscreen() {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (isFs) return;
    const now = performance.now();
    if (now - lastFsTry < 1000) return;
    lastFsTry = now;
    try {
      const el = document.documentElement;
      const p = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
      if (p && p.catch) p.catch(() => {});
    } catch (err) { /* браузер не дал — попробуем на следующем жесте */ }
  }

  function firstTouch() {
    ensureAudio();
    hint.style.opacity = '0';
    tryFullscreen();
  }

  function celebrate() {
    interactions++;
    if (interactions % 12 === 0) {
      const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
      spawnGlyph(emoji, W / 2, H / 2, Math.min(W, H) * 0.45);
      spawnBurst(W / 2, H / 2, 30);
      playChord();
      return true;
    }
    return false;
  }

  window.addEventListener('keydown', (e) => {
    // блокируем всё, что браузер позволяет перехватить (Cmd+P, Cmd+F, Cmd+S и т.п.);
    // зарезервированные Cmd+T/N/W из страницы не блокируются — для них есть киоск-режим
    e.preventDefault();
    firstTouch();
    if (throttled()) return;
    const char = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    const x = W * (0.1 + Math.random() * 0.8);
    const y = H * (0.15 + Math.random() * 0.7);
    spawnGlyph(char, x, y, 110 + Math.random() * 80);
    if (!celebrate()) playNote(randomNote());
  }, { passive: false });

  window.addEventListener('pointerdown', (e) => {
    firstTouch();
    if (throttled()) return;
    spawnBurst(e.clientX, e.clientY, 18);
    spawnGlyph(EMOJIS[Math.floor(Math.random() * EMOJIS.length)], e.clientX, e.clientY, 90 + Math.random() * 60);
    if (!celebrate()) playNote(randomNote());
  });

  let lastMove = 0;
  window.addEventListener('pointermove', (e) => {
    const now = performance.now();
    if (now - lastMove < 20) return;
    lastMove = now;
    spawnSpark(e.clientX, e.clientY);
  });

  // защита от случайных жестов и закрытия
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  window.addEventListener('gesturestart', (e) => e.preventDefault());
  window.addEventListener('beforeunload', (e) => {
    if (interactions > 0) { e.preventDefault(); e.returnValue = ''; }
  });

  // ----- отрисовка -----
  let prev = performance.now();
  function frame(now) {
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    ctx.clearRect(0, 0, W, H);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      const t = p.age / p.life;
      const fade = t > 0.75 ? 1 - (t - 0.75) / 0.25 : 1;

      if (p.type === 'glyph') {
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        const pop = p.age < 0.35 ? easeOutBack(p.age / 0.35) : 1;
        const w = p.size * 1.3 * pop;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = fade;
        ctx.drawImage(sprite(p.char), -w / 2, -w / 2, w, w);
        ctx.restore();
      } else if (p.type === 'confetti') {
        p.vy += 600 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        ctx.globalAlpha = fade;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      } else { // spark
        ctx.globalAlpha = fade * 0.9;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (1 - t * 0.6), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
